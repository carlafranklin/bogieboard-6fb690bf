name: Monitor Feed Health

on:
  schedule:
    - cron: '0 8 */2 * *' # Every 2 days at 8am UTC
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check feed health
        run: |
          curl -s -w "\nHTTP Status: %{http_code}\n" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"send_email": true}' \
            "https://wxmewdwqeeejoetwyiem.supabase.co/functions/v1/monitor-feeds"
