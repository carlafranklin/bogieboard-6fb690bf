name: Cleanup Expired Events

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (resolves SUPABASE_URL/SUPABASE_ANON_KEY)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - develop
      dry_run:
        description: 'Dry run mode (no database writes)'
        required: false
        default: 'false'
        type: boolean

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Run cleanup-events function
        run: |
          curl -s -w "\nHTTP Status: %{http_code}\n" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"dry_run": ${{ inputs.dry_run || false }}}' \
            "${{ secrets.SUPABASE_URL }}/functions/v1/cleanup-events"
