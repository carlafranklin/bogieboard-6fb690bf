name: Scrape Events (HTML + AI)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (resolves SUPABASE_URL/SUPABASE_ANON_KEY)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - develop

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Trigger scrape-events function
        run: |
          curl -s -w "\nHTTP Status: %{http_code}\n" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/scrape-events"
