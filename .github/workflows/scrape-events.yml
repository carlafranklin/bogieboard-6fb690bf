name: Scrape Events (HTML + AI)

on:
  schedule:
    - cron: '0 3,15 * * *' # Twice daily at 3am and 3pm UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape-events function
        run: |
          curl -s -w "\nHTTP Status: %{http_code}\n" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://wxmewdwqeeejoetwyiem.supabase.co/functions/v1/scrape-events"
